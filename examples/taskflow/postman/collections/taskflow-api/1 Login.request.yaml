$kind: http-request
id: 480b7f1279911e7f3c724c2e
name: 1 Login
method: POST
url: '{{baseUrl}}/api/auth/login'
body:
  type: json
  content: '{"username":"alice","password":"alice-pass"}'
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: afterResponse
    code: |
      pm.test("login returns 200", () => pm.response.to.have.status(200));
      pm.test("response has a token", () => {
        const body = pm.response.json();
        pm.expect(body.token).to.be.a("string").and.not.empty;
        pm.collectionVariables.set("token", body.token);
      });
    language: text/javascript
